# hexa.toml — gamebox standalone package manifest
#
# Spec: shared/hexa-lang/hexa-toml-spec.json (version 1.0.0)
# Distribution target: hx install gamebox
# Provenance: extracted from dancinlife/airgenome-gamebox 2026-05-05
#             (67 BG cycles cumulative, 2026-05-03 to 2026-05-05)
#             Forensic verdict 2026-05-05: SKELETON_TIER_100PCT_WIN32_VALIDATED_MANJEOM_0
#             skeleton_manjeom = 100 (Win32 fn coverage 435/435 + perf families 18+ at 100%);
#             validated_manjeom = 0 (no real game frames evidenced — hexa interp
#             missing closure CM-26..CM-30 per docs/CLOSURE_ROADMAP.md §5).

[package]
name = "gamebox"
version = "1.0.4"
entry = "cli/gamebox.hexa"
description = "Apple-native Win32 game runtime — hexa-only, Wine 0, D3DMetal-pinned. Skeleton-tier 100% Win32 fn coverage (435/435) + 18+ perf families at 100%; raw#10 honest C3 (validated_manjeom = 0, skeleton-only)."
license = "Apache-2.0"
authors = ["박민우 <nerve011235@gmail.com>"]
repository = "https://github.com/need-singularity/gamebox"
homepage = "https://github.com/need-singularity/gamebox"
readme = "README.md"
keywords = ["gamebox", "win32", "mac", "hexa-lang", "wine-0", "d3dmetal", "apple-silicon"]
categories = ["game-runtime", "simulation"]

[lib]
# Library entry — importable by other hexa packages.
entry = "lib/loader/dll_resolve_master.hexa"

[[bin]]
name = "gamebox"
path = "cli/gamebox.hexa"

[test]
runner = "hexa"
files = [
    "tests/test_apple_only.hexa",
    "tests/test_closure.hexa",
    "tests/test_own2.hexa",
    "tests/test_d2r_archive_round_trip.hexa",
    "tests/test_d2r_d3d11_synthetic_scaffold.hexa",
    "tests/test_d2r_pe_synthetic_round_trip.hexa",
    "tests/test_purple_lineage_offline_shim.hexa",
    "tests/test_roadmap_op_self_impl.hexa",
]

# ── hx install hook ───────────────────────────────────────
# install.hexa runs under hx package manager (hexa-lang) at install time.
# Phases: pre  → D3DMetal/Apple SDK detect (warn-only, gamebox can stub)
#         post → quick selftest (warn-only, not a blocker)
[scripts]
install = "install.hexa"

# ── Modules manifest (loaders + perf + tools) ────────────
[modules]
# Loader layer — PE/Win32 + DX subsystems
gamebox_loader_pe_core = [
    "lib/loader/pe_acl_descriptor.hexa",
    "lib/loader/pe_advapi32_core.hexa",
    "lib/loader/pe_apc_queue.hexa",
    "lib/loader/pe_avrt_thread_priority.hexa",
    "lib/loader/pe_call_conv_cdecl.hexa",
    "lib/loader/pe_call_conv_fastcall.hexa",
    "lib/loader/pe_call_conv_stdcall.hexa",
    "lib/loader/pe_call_conv_to_arm64.hexa",
    "lib/loader/pe_call_conv_vectorcall.hexa",
    "lib/loader/pe_call_conv_x64_ms.hexa",
]
gamebox_loader_pe_battlenet = [
    "lib/loader/pe_battle_net_agent_ipc_track.hexa",
    "lib/loader/pe_battle_net_download_track.hexa",
    "lib/loader/pe_battle_net_oauth_token.hexa",
    "lib/loader/pe_battle_net_setup_install_phase.hexa",
    "lib/loader/pe_battlenet_agent_http_rest.hexa",
    "lib/loader/pe_battlenet_agent_sd_forging.hexa",
    "lib/loader/pe_battlenet_setup_install_path_real.hexa",
    "lib/loader/pe_battlenet_setup_static_crt_path.hexa",
    "lib/loader/battlenet_bypass.hexa",
]
gamebox_loader_dx = [
    "lib/loader/dx_d3d11.hexa",
    "lib/loader/dx_d3d11_stage1.hexa",
    "lib/loader/dx_d3d12.hexa",
    "lib/loader/dx_d3d12_stage1.hexa",
    "lib/loader/dx_d3d12_stage2.hexa",
]
gamebox_loader_runtime = [
    "lib/loader/dll_resolve_master.hexa",
    "lib/loader/iat_runtime_bind.hexa",
    "lib/loader/i386_call_frame.hexa",
    "lib/loader/native_helper_bridge.hexa",
    "lib/loader/oss_validate.hexa",
]
gamebox_loader_launchers = [
    "lib/loader/d2r_launch.hexa",
    "lib/loader/d4_launch.hexa",
]

# Perf layer — 104 unique families across 242 modules; 18+ at 100% manjeom
# (skeleton-tier; validated_manjeom = 0 per raw#10 honest C3).
# Full enumeration in lib/perf/ (242 c_*_*.hexa files, snake_case).
# Top-tier families (18 at 100% per Track BL/BM forensic):
gamebox_perf_top_families = [
    "lib/perf/c_abi_calling_convention_track.hexa",
    "lib/perf/c_anticheat_detection_track.hexa",
    "lib/perf/c_audio_dsp.hexa",
    "lib/perf/c_bnet_login_state_track.hexa",
    "lib/perf/c_bnet_token_refresh_track.hexa",
    "lib/perf/c_cdn_chunk_assemble_track.hexa",
]
# Note (Track CG 2026-05-05): the prior c_d2r_archive_round_trip perf entry
# was removed as an orphan reference — file did not exist on disk and no
# internal hexa code referenced it. The D2R MPQ archive round-trip
# functionality is covered by `pe_d2r_mpq_archive_load` + `pe_d2r_savegame_d2s_format`
# in `lib/loader/` (loader-class), exercised by `test_d2r_archive_round_trip`
# in `tests/`. See `gamebox/doc/gamebox_c_d2r_archive_round_trip_drift_fix_track_cg_landed_2026_05_05.ai.md`.

# Tools — 2 hexa CLIs under tool/
gamebox_tools = [
    "tool/roadmap_op.hexa",
    "tool/closure_orchestrator.hexa",
]
